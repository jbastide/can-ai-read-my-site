name: Test and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and end-to-end tests
        run: python -m unittest discover -s tests -v
      - name: Install and run the command
        run: |
          pip install .
          can-ai-read --version

  container:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t can-ai-read:test .
      - name: Start it and check that it answers
        run: |
          docker run -d --name car -p 8080:8080 --read-only --cap-drop ALL can-ai-read:test
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ | grep -q "Can AI read"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{"urls":["http://169.254.169.254/latest/meta-data/"]}' http://127.0.0.1:8080/api/check)
          test "$code" = "400"
          docker logs car
      - name: Set up multi-platform builds
        if: github.event_name == 'push'
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
        if: github.event_name == 'push'
      - name: Sign in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Work out the image tags
        if: github.event_name == 'push'
        id: tags
        run: |
          image=ghcr.io/${{ github.repository_owner }}/can-ai-read-my-site
          tags="$image:latest"
          if [ "${{ github.ref_type }}" = "tag" ]; then tags="$tags,$image:${GITHUB_REF_NAME#v}"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Publish for Intel and ARM servers
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
